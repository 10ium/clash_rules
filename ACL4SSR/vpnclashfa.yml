# ---------------------------------------------------------------------------------- #
#          فایل قالب پایه Clash (نسخه نهایی - شامل قوانین ثابت و تنظیمات عمومی)        #
#                 آدرس: https://raw.githubusercontent.com/10ium/clash_rules/refs/heads/main/ACL4SSR/vpnclashfa.yml
# ---------------------------------------------------------------------------------- #

# -- تنظیمات عمومی --
global-client-fingerprint: chrome
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
tcp-concurrent: true
enable-process: true
find-process-mode: strict
ipv6: true
log-level: info
geo-auto-update: true
geo-update-interval: 168
bind-address: '*'
profile:
  store-selected: true
  store-fake-ip: true

# -- تنظیمات DNS --
dns:
  enable: true
  ipv6: true
  respect-rules: false
  prefer-h3: true
  cache-algorithm: arc
  use-system-hosts: true
  use-host: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-filter-mode: blacklist
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '*.ir'
  default-nameserver:
    - 8.8.8.8
    - 8.8.4.4
    - 1.1.1.1
    - 9.9.9.9
    - 94.140.14.15
    - 223.5.5.5
  nameserver:
    - 'https://sky.rethinkdns.com/1:sIMQAAAFMAAAEQgAAgA='
    - 'https://dns.nextdns.io/f1d647'
    - 'https://dns.adguard-dns.com/dns-query'
    - 'tls://dns.adguard-dns.com'
  direct-nameserver:
    - '78.157.42.100'
    - '178.22.122.100'
  proxy-server-nameserver:
    - '1.1.1.1'
    - '8.8.8.8'

# -- تنظیمات Sniffer و TUN --
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, 8080, 8880, 2052, 2082, 2086, 2095] }
    TLS: { ports: [443, 8443, 2053, 2083, 2087, 2096] }
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  auto-redir: true
  dns-hijack: ["any:53", "tcp://any:53"]

# -- بخش‌های خالی (توسط لینک اشتراک و فایل INI پر می‌شوند) --
proxies: [] # <<<< این بخش توسط لینک اشتراک پر می‌شود >>>>
proxy-groups: [] # <<<< این بخش توسط [Custom Proxy Group] در INI پر می‌شود >>>>
rule-providers: {} # <<<< این بخش توسط [Rule] در INI پر می‌شود >>>>

# -- قوانین ثابت (غیر RULE-SET) - این‌ها باقی می‌مانند --
rules:
  # قوانین PROCESS-NAME
  - PROCESS-NAME,Telegram.exe,تلگرام 💬
  - PROCESS-NAME,org.telegram.messenger,تلگرام 💬
  - PROCESS-NAME,org.telegram.messenger.web,تلگرام 💬
  - PROCESS-NAME,com.instagram.android,اینستاگرام 📸
  - PROCESS-NAME,com.android.vending,نوع انتخاب پروکسی 🔀
  - PROCESS-NAME,com.google.android.gms,نوع انتخاب پروکسی 🔀
  # قوانین DOMAIN-SUFFIX
  - DOMAIN-SUFFIX,deepseek.com,هوش مصنوعی 🤖
  - DOMAIN-SUFFIX,qwen.ai,هوش مصنوعی 🤖
  # قانون نهایی (قوانین RULE-SET از INI قبل از این قرار می‌گیرند)
  - MATCH,نوع انتخاب پروکسی 🔀

# -- تنظیمات NTP --
ntp:
  enable: true
  server: "time.apple.com"
  port: 123
  interval: 30