[General]
; --->>> مهم: این خط فایل INI را به فایل YML شما در GitHub متصل می‌کند <<<---
clash_rule_base = https://raw.githubusercontent.com/10ium/clash_rules/refs/heads/main/ACL4SSR/vpnclashfa.yml

enable_rule_generator = true
overwrite_original_rules = false # <<<< مهم: قوانین پایه را نگه می‌داریم و RULE-SET ها را اضافه می‌کنیم >>>>
enable_rule_provider_generator = true
filename = VpnClashFa_Generated.yml ; نام فایل خروجی دلخواه
url_test_url = https://api.v2fly.org/checkConnection.svgz
url_test_interval = 600
url_test_timeout = 6000
fallback_url = https://www.gstatic.com/generate_204
fallback_interval = 600
load_balance_url = https://api.v2fly.org/checkConnection.svgz
load_balance_interval = 600

